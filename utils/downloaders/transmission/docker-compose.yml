# Test stack for Click a Magnet — Transmission Web UI
# Usage: docker compose up -d
# Extension URL: http://localhost:9091  |  user: admin  |  pass: admin

services:
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: cam-test-transmission
    restart: unless-stopped
    ports:
      - '9091:9091'
      - '51413:51413'
      - '51413:51413/udp'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - USER=admin
      - PASS=admin
    volumes:
      - ./config:/config
      - ./downloads:/downloads
