# Test stack for Click a Magnet — BiglyBT Web UI (XM Web UI / TrguiNG)
# Usage: docker compose up -d
# Extension URL: http://localhost:8082  |  user: admin  |  pass: admin
# First launch can take several minutes — check logs: docker compose logs -f

services:
  biglybt:
    image: ghcr.io/azicen/biglybt:latest
    platform: linux/amd64
    container_name: cam-test-biglybt
    restart: unless-stopped
    ports:
      - '8082:9091'
      - '6884:6881'
      - '6884:6881/udp'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - WEBUI_PORT=9091
      - WEBUI_USER=admin
      - WEBUI_PASSWD=admin
    volumes:
      - ./config:/config
      - ./downloads:/downloads
