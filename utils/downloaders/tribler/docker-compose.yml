# Test stack for Click a Magnet — Tribler
# Usage: docker compose up -d
# Extension URL: http://localhost:8085  |  API key: click-a-magnet-test
# First launch can take 1–2 minutes — check logs: docker compose logs -f

services:
  tribler:
    image: tribler/tribler:latest
    platform: linux/amd64
    container_name: cam-test-tribler
    restart: unless-stopped
    ports:
      - '8085:8085'
    environment:
      - TZ=UTC
      - CORE_API_PORT=8085
      - CORE_API_KEY=click-a-magnet-test
      - CORE_API_BIND_ADDRESS=0.0.0.0
      - LANG=C.UTF-8
    volumes:
      - tribler-state:/root/.Tribler
      - ./entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["-s"]

volumes:
  tribler-state:
