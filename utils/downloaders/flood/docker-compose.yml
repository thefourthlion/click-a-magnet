# Test stack for Click a Magnet — Flood + rTorrent (all-in-one)
# Usage: docker compose up -d
# Extension URL: http://localhost:8088
# Credentials: none required (--auth none); create a user via Web UI if you disable noauth
#
# First boot: open http://localhost:8088 once if the backend client is not linked yet.

services:
  flood:
    image: jesec/rtorrent-flood:master-distroless
    container_name: cam-test-flood
    restart: unless-stopped
    ports:
      - '8088:3000'
      - '6888:6881'
      - '6888:6881/udp'
    environment:
      HOME: /config
      FLOOD_OPTION_auth: none
      FLOOD_OPTION_port: '3000'
    command: --port 3000 --allowedpath /data --auth none
    volumes:
      - ./config:/config
      - ./downloads:/data
