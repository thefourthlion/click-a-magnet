# Test stack for Click a Magnet — Deluge Web UI
# Usage: docker compose up -d
# Extension URL: http://localhost:8112  |  password: deluge  (no username)

services:
  deluge:
    image: lscr.io/linuxserver/deluge:latest
    container_name: cam-test-deluge
    restart: unless-stopped
    ports:
      - '8112:8112'
      - '6882:6881'
      - '6882:6881/udp'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - DELUGE_LOGLEVEL=info
    volumes:
      - ./config:/config
      - ./downloads:/downloads
